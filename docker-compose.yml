version: "3.9"

services:
  db:
    image: postgres:15
    container_name: movie_db
    environment:
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_pass
      POSTGRES_DB: movie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://movie_user:movie_pass@db:5432/movie_db
    expose:
      - "8000"
  
  nginx:
    image: nginx:latest
    container_name: movie_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
  

volumes:
  postgres_data: