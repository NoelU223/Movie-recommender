version: "3.9"

services:
  db:
    image: postgres:15
    container_name: movie_db
    environment:
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_pass
      POSTGRES_DB: movie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: movie_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  prometheus:
    image: prom/prometheus:latest
    container_name: movie_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: movie_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  backend:
    build: ./backend
    depends_on:
      - db
      - redis
      - kafka 
    environment:
      DATABASE_URL: postgresql://movie_user:movie_pass@db:5432/movie_db
      REDIS_URL: redis://redis:6379/0
      TMDB_TOKEN: ${TMDB_TOKEN} 
      KAFKA_BOOTSTRAP: kafka:29092 
    expose:
      - "8000"
    volumes:
      - model_data:/app/model
    healthcheck:  
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: movie_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend

  batch_processor:
    build: ./backend
    container_name: movie_batch
    command: python -m batch.run_batch || echo "Batch skipped"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://movie_user:movie_pass@db:5432/movie_db

  minio:
    image: minio/minio
    container_name: movie_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  tmdb_import:
    build: ./backend
    container_name: movie_tmdb_import
    command: python -m app.tmdb.importer
    depends_on:
      - db
      - redis 
    environment:
      DATABASE_URL: postgresql://movie_user:movie_pass@db:5432/movie_db
      TMDB_TOKEN: ${TMDB_TOKEN}
      REDIS_URL: redis://redis:6379/0     

    restart: unless-stopped    
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: movie_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: movie_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_INTERNAL://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_INTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  
  events_consumer:
    build: ./backend
    container_name: movie_events_consumer
    command: python -m app.events.consumer.run_consumer
    depends_on:
      - kafka
      - minio
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    restart: unless-stopped

  data_generator:
    build: ./backend
    container_name: movie_data_generator
    command: python -m app.ml.generate_data
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://movie_user:movie_pass@db:5432/movie_db
    profiles:
      - tools

  ml_trainer:
    build: ./backend
    container_name: movie_ml_trainer
    command: python -m app.ml.train
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://movie_user:movie_pass@db:5432/movie_db
    volumes:
      - model_data:/app/model
    profiles:
      - tools

volumes:
  postgres_data:
  minio_data:
  grafana_data:
  model_data: