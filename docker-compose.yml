version: "3.9"

services:
  db:
    image: postgres:15
    container_name: movie_db
    environment:
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_pass
      POSTGRES_DB: movie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: movie_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  prometheus:
    image: prom/prometheus:latest
    container_name: movie_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: movie_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  backend:
    build: ./backend
    depends_on:
      - db
      - redis 
    environment:
      DATABASE_URL: postgresql://movie_user:movie_pass@db:5432/movie_db
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    healthcheck:  
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: movie_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  batch_processor:
    build: ./backend
    container_name: movie_batch
    command: python -m batch.run_batch || echo "Batch skipped"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://movie_user:movie_pass@db:5432/movie_db

  minio:
    image: minio/minio
    container_name: movie_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
  grafana_data:
