{% extends "base.html" %}
{% block content %}
<div class="row">
  <div class="col-md-7">
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h1 class="h3 mb-1">{{ movie.title }}</h1>
        <p class="text-muted mb-2">{{ movie.year }} · {{ movie.genre }}</p>

        {% if avg_rating %}
          <p class="mb-1">
            <strong>Prosječna ocjena:</strong>
            <span class="badge bg-success">{{ "%.1f"|format(avg_rating) }}/10</span>
            <span class="text-muted small ms-1">({{ count }} ocjena)</span>
          </p>
        {% else %}
          <p class="text-muted mb-1">Još nema ocjena za ovaj film.</p>
        {% endif %}
      </div>
    </div>
  </div>

  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3">Dodaj ili promijeni ocjenu</h2>
        <form method="post" action="/ratings/html">
          <div class="mb-3">
            <label class="form-label">Korisnik</label>
            <select class="form-select" name="user_id" required>
              <option value="" disabled selected>Odaberi korisnika</option>
              {% for u in users %}
                <option value="{{ u.id }}">{{ u.email }} (ID {{ u.id }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Ocjena (1–10)</label>
            <input type="number" class="form-control" name="rating" min="1" max="10" required>
          </div>
          <input type="hidden" name="movie_id" value="{{ movie.id }}">
          <button type="submit" class="btn btn-primary w-100">Spremi ocjenu</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
