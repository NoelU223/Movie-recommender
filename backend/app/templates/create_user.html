{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Novi korisnik</h1>
        <form method="post" action="/users/new">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required placeholder="korisnik@example.com">
          </div>
          <button type="submit" class="btn btn-primary w-100">Spremi korisnika</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
