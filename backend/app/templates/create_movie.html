{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  {% if not current_user %}
  <div class="col-md-6">
    <div class="alert alert-warning">
      <h5>Morate biti <a href="/login">prijavljeni</a> da biste dodavali filmove.</h5>
      <p class="mb-0">Ako nemate račun, <a href="/users/new">registrirajte se</a>.</p>
    </div>
  </div>
  {% else %}
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Novi film</h1>
        <p class="text-muted small mb-3">Dobrodošli, {{ current_user.email }}</p>
        <form method="post" action="/new-movie">
          <div class="mb-3">
            <label class="form-label">Naslov</label>
            <input type="text" class="form-control" name="title" required placeholder="The Matrix">
          </div>
          <div class="mb-3">
            <label class="form-label">Žanr</label>
            <input type="text" class="form-control" name="genre" required placeholder="Sci-Fi">
          </div>
          <div class="mb-3">
            <label class="form-label">Godina</label>
            <input type="number" class="form-control" name="year" required min="1900" max="2025" placeholder="1999">
          </div>
          <button type="submit" class="btn btn-success w-100">Dodaj film</button>
        </form>
      </div>
    </div>
  </div>
  {% endif %}
</div>
{% endblock %}
