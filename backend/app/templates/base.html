<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <title>MovieApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">MovieApp</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExampleDefault">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarsExampleDefault">
      <div class="d-flex align-items-center ms-auto">
        {% if current_user %}
          <a class="btn btn-sm btn-outline-light me-2" href="/profile">Moj profil</a>
          <span class="text-light small me-2">
            Prijavljen kao {{ current_user.email }}
          </span>
          <a class="btn btn-sm btn-outline-warning" href="/logout">Logout</a>
        {% else %}
          <a class="btn btn-sm btn-outline-light me-2" href="/login">Login</a>
          <a class="btn btn-sm btn-warning" href="/users/new">Registracija</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
